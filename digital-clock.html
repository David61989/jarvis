<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock - Multiple Time Zones</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(0, 0, 0, 0.8);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #00ff88;
            margin-bottom: 40px;
            font-size: 2.5em;
            text-shadow: 0 0 10px #00ff88;
        }

        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .clock-card {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 2px solid #00ff88;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        .clock-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.6);
        }

        .timezone-name {
            font-size: 1.2em;
            color: #00ff88;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .timezone-location {
            font-size: 0.9em;
            color: #888;
            margin-bottom: 15px;
        }

        .digital-time {
            font-size: 2.5em;
            color: #00ff88;
            font-weight: bold;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #00ff88;
            margin-bottom: 10px;
            font-family: 'Courier New', monospace;
        }

        .date-info {
            font-size: 0.9em;
            color: #aaa;
            margin-top: 10px;
        }

        .am-pm {
            font-size: 1em;
            color: #ff6b9d;
            margin-top: 5px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .add-timezone-section {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        select {
            padding: 10px 15px;
            border-radius: 10px;
            border: 2px solid #00ff88;
            background: #1a1a2e;
            color: #00ff88;
            font-size: 1em;
            cursor: pointer;
        }

        select option {
            background: #1a1a2e;
            color: #00ff88;
        }

        .status-message {
            text-align: center;
            color: #ff6b9d;
            margin-top: 10px;
            font-size: 0.9em;
            min-height: 20px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8em;
            }

            .digital-time {
                font-size: 2em;
            }

            .clocks-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⏰ DIGITAL CLOCK</h1>

        <div class="clocks-grid" id="clocksGrid">
            <!-- Clock cards will be generated here -->
        </div>

        <div class="controls">
            <button onclick="resetClocks()">🔄 Reset to Default</button>
            <button onclick="toggle24Hour()">12/24 Hour</button>
        </div>

        <div class="add-timezone-section">
            <select id="timezoneSelect" onchange="addCustomTimezone()">
                <option value="">+ Add Custom Timezone</option>
            </select>
        </div>

        <div class="status-message" id="statusMessage"></div>
    </div>

    <script>
        let is24Hour = true;
        let customTimezones = [];

        const defaultTimezones = [
            { name: 'New York', timezone: 'America/New_York' },
            { name: 'London', timezone: 'Europe/London' },
            { name: 'Tokyo', timezone: 'Asia/Tokyo' },
            { name: 'Sydney', timezone: 'Australia/Sydney' },
            { name: 'Dubai', timezone: 'Asia/Dubai' },
            { name: 'Los Angeles', timezone: 'America/Los_Angeles' }
        ];

        const allTimezones = [
            'Africa/Cairo', 'Africa/Johannesburg', 'America/Anchorage', 'America/Argentina/Buenos_Aires',
            'America/Chicago', 'America/Denver', 'America/Mexico_City', 'America/New_York', 'America/Toronto',
            'America/Vancouver', 'Asia/Bangkok', 'Asia/Dubai', 'Asia/Hong_Kong', 'Asia/Kolkata', 'Asia/Shanghai',
            'Asia/Singapore', 'Asia/Tokyo', 'Atlantic/Azores', 'Australia/Melbourne', 'Australia/Perth',
            'Australia/Sydney', 'Europe/Berlin', 'Europe/London', 'Europe/Madrid', 'Europe/Moscow', 'Europe/Paris',
            'Europe/Rome', 'Pacific/Auckland', 'Pacific/Fiji', 'Pacific/Honolulu', 'UTC'
        ];

        function getTimezoneOffset(timezone) {
            const now = new Date();
            const formatter = new Intl.DateTimeFormat('en-US', { timeZone: timezone, hour12: false });
            const parts = formatter.formatToParts(now);
            return parts;
        }

        function formatTime(date, timezone, use24Hour) {
            try {
                const options = {
                    timeZone: timezone,
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: !use24Hour
                };

                const timeString = new Intl.DateTimeFormat('en-US', options).format(date);
                return timeString;
            } catch (e) {
                return 'Invalid TZ';
            }
        }

        function formatDate(date, timezone) {
            try {
                const options = {
                    timeZone: timezone,
                    weekday: 'short',
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                };

                return new Intl.DateTimeFormat('en-US', options).format(date);
            } catch (e) {
                return '';
            }
        }

        function updateClocks() {
            const now = new Date();
            const allClocks = [...defaultTimezones, ...customTimezones];

            const grid = document.getElementById('clocksGrid');
            grid.innerHTML = '';

            allClocks.forEach((location, index) => {
                const time = formatTime(now, location.timezone, is24Hour);
                const date = formatDate(now, location.timezone);

                const clockCard = document.createElement('div');
                clockCard.className = 'clock-card';
                clockCard.innerHTML = `
                    <div class="timezone-name">${location.name}</div>
                    <div class="timezone-location">${location.timezone}</div>
                    <div class="digital-time">${time}</div>
                    <div class="date-info">${date}</div>
                    ${customTimezones.includes(location) ? `<button onclick="removeTimezone(${defaultTimezones.length + customTimezones.indexOf(location)})" style="margin-top: 10px; padding: 8px 15px; font-size: 0.8em;">Remove</button>` : ''}
                `;

                grid.appendChild(clockCard);
            });
        }

        function populateTimezoneSelect() {
            const select = document.getElementById('timezoneSelect');
            select.innerHTML = '<option value="">+ Add Custom Timezone</option>';

            allTimezones.forEach(tz => {
                const isDefault = defaultTimezones.some(d => d.timezone === tz);
                const isCustom = customTimezones.some(c => c.timezone === tz);

                if (!isDefault && !isCustom) {
                    const option = document.createElement('option');
                    option.value = tz;
                    option.textContent = tz;
                    select.appendChild(option);
                }
            });
        }

        function addCustomTimezone() {
            const select = document.getElementById('timezoneSelect');
            const timezone = select.value;

            if (timezone) {
                const name = timezone.split('/').pop();
                customTimezones.push({ name, timezone });
                select.value = '';
                updateClocks();
                populateTimezoneSelect();

                const statusMsg = document.getElementById('statusMessage');
                statusMsg.textContent = `✓ Added timezone: ${timezone}`;
                setTimeout(() => statusMsg.textContent = '', 3000);
            }
        }

        function removeTimezone(index) {
            const removeIndex = index - defaultTimezones.length;
            if (removeIndex >= 0 && removeIndex < customTimezones.length) {
                const removed = customTimezones[removeIndex];
                customTimezones.splice(removeIndex, 1);
                updateClocks();
                populateTimezoneSelect();

                const statusMsg = document.getElementById('statusMessage');
                statusMsg.textContent = `✓ Removed: ${removed.timezone}`;
                setTimeout(() => statusMsg.textContent = '', 3000);
            }
        }

        function resetClocks() {
            customTimezones = [];
            updateClocks();
            populateTimezoneSelect();

            const statusMsg = document.getElementById('statusMessage');
            statusMsg.textContent = '✓ Reset to default timezones';
            setTimeout(() => statusMsg.textContent = '', 3000);
        }

        function toggle24Hour() {
            is24Hour = !is24Hour;
            updateClocks();

            const statusMsg = document.getElementById('statusMessage');
            statusMsg.textContent = `✓ Switched to ${is24Hour ? '24-hour' : '12-hour'} format`;
            setTimeout(() => statusMsg.textContent = '', 3000);
        }

        // Initialize
        populateTimezoneSelect();
        updateClocks();

        // Update every second
        setInterval(updateClocks, 1000);
    </script>
</body>
</html>
